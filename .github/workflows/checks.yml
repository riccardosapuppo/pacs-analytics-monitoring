name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  # Every job here has a timeout. One that hangs is worse than one that fails:
  # it stays amber for six hours and nobody looks at it, while a red one sends
  # an email.
  the-claim:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The version this is known to run on, and the one `engines` declares.
          # node:sqlite is unflagged from 24; on 22 it is behind a flag, which
          # is the sort of thing that only shows up here.
          node-version: '24'

      - run: npm ci

      - name: the parts
        run: npm test

      - name: the types
        # `tsc` produces nothing here: there is no build. It is a checker, and
        # `erasableSyntaxOnly` in tsconfig.json makes it also the guarantee that
        # Node can still run these files without one.
        run: npm run typecheck

      - name: the claim
        # Fails the run if the side that reads the schema is not right
        # everywhere. Not a threshold: the six installations hold the same
        # studies, so anything other than the same answers is a defect.
        run: npm run measure

      - name: what the two unexecuted dialects emit
        run: npm run check:dialects

      - name: the mark in the header and the mark in the tab
        run: npm run check:mark

      - name: nobody can be handed yesterday's page
        run: npm run check:serving

      - name: it answers, over HTTP, from a standing start
        # The README opens with `npm start`. This is that command, and requests
        # to the thing it starts -- the check that catches a project which
        # builds and tests and does not run.
        run: |
          PORT=3899 node src/index.ts --no-open &
          service=$!
          trap 'kill $service 2>/dev/null || true' EXIT

          for try in $(seq 1 100); do
            if curl -sf "http://127.0.0.1:3899/api/health" > /dev/null; then break; fi
            sleep 0.2
          done

          # Parsed, not grepped.
          #
          # The first version looked for the text '"ok":true' and the service
          # answers in indented JSON, so what it actually sends is
          # '"ok": true' with a space. The check failed while the service was
          # answering perfectly, which is the most expensive kind of red.
          curl -sf "http://127.0.0.1:3899/api/health" \
            | node -e 'const said = JSON.parse(require("fs").readFileSync(0)); if (said.ok !== true) { console.error("it did not answer about itself:", said); process.exit(1); }'

          # The invariant, over HTTP: two installations that disagree about
          # every column name give the same count.
          one=$(curl -sf "http://127.0.0.1:3899/api/dashboard?installation=as-documented" \
                 | node -pe 'JSON.parse(require("fs").readFileSync(0)).summary.studies')
          two=$(curl -sf "http://127.0.0.1:3899/api/dashboard?installation=older-column-names" \
                 | node -pe 'JSON.parse(require("fs").readFileSync(0)).summary.studies')

          echo "as-documented: $one   older-column-names: $two"
          [ "$one" = "$two" ] || { echo "the same studies gave different answers"; exit 1; }

      - name: nothing here writes to the archive
        # The claim the whole project rests on. Read-only is easy to be and
        # easy to stop being, and the day somebody adds a write should be the
        # day this goes red rather than the day somebody notices in review.
        run: |
          # A STATEMENT, not a word.
          #
          # The first version looked for INSERT, UPDATE and DELETE on their
          # own, and the only thing it found was the sentence in the service
          # saying there are none of them. A check that fires on its own
          # documentation is a check somebody deletes.
          #
          # src/fixtures/ is excluded because it BUILDS the six databases,
          # which is the one place a CREATE and an INSERT belong.
          writes='INSERT\s+INTO|UPDATE\s+\w+\s+SET|DELETE\s+FROM|DROP\s+(TABLE|INDEX)|ALTER\s+TABLE|CREATE\s+(TABLE|INDEX)|TRUNCATE'

          found=$(grep -rlP "$writes" src/ --include='*.js' | grep -v 'src/fixtures/' || true)

          if [ -n "$found" ]; then
            echo "these write, and only src/fixtures/ may:"
            grep -rnP "$writes" $found || true
            exit 1
          fi

          # And it must be able to find one, or it is a check that passes by
          # matching nothing (which is how they usually stop working).
          if ! grep -rqP "$writes" src/fixtures/; then
            echo "the pattern found no writes even in src/fixtures/, which builds the databases"
            echo "this check has stopped being able to see one"
            exit 1
          fi

          echo "nothing outside src/fixtures/ writes anything, and the pattern can still see one"
      - name: and no runtime dependency crept in
        run: |
          node -e '
            const held = Object.keys(require("./package.json").dependencies ?? {});
            console.log("runtime dependencies:", held.length ? held.join(", ") : "none");
            if (held.length) {
              console.error("The README says there are none. If that changed, say so there and change this.");
              process.exit(1);
            }
          '

# `npm run check:screen` and `npm run screenshots` are not here, and that is
# deliberate. Both drive the browser already installed on the machine
# (`channel: msedge`) rather than downloading one, which is the right trade on a
# workstation and impossible on a runner that has no browser. Making them pass
# in CI would mean pulling several hundred megabytes of Chromium on every push.
# They run before every commit instead, and they say plainly when they cannot.
